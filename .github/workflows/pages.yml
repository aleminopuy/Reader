name: Publish site

# Copies the app files to the gh-pages branch, which GitHub Pages serves at
# https://aleminopuy.github.io/Reader/ (no repo settings needed).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push app files to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir _site
          cp -r index.html styles.css sw.js manifest.webmanifest icons src _site/
          touch _site/.nojekyll
          cd _site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
